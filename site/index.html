<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Academia - Acesso Remoto</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100">
    <div class="min-h-screen flex items-center justify-center">
        <div class="bg-white p-8 rounded-lg shadow-lg w-96">
            <h1 class="text-2xl font-semibold text-center mb-4">Acesso Remoto - Academia</h1>
            <form id="login-form" onsubmit="handleLogin(event)">
                <div class="mb-4">
                    <label for="email" class="block text-sm font-medium text-gray-700">E-mail</label>
                    <input type="email" id="email" name="email" required class="w-full p-3 mt-1 border border-gray-300 rounded-md focus:ring-indigo-500 focus:border-indigo-500">
                </div>
                <div class="mb-6">
                    <label for="password" class="block text-sm font-medium text-gray-700">Senha</label>
                    <input type="password" id="password" name="password" required class="w-full p-3 mt-1 border border-gray-300 rounded-md focus:ring-indigo-500 focus:border-indigo-500">
                </div>
                <button type="submit" class="w-full bg-blue-600 text-white py-3 rounded-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-opacity-50">Entrar</button>
            </form>
        </div>
    </div>

    <!-- Tela de Dados do Aluno (inicialmente oculta) -->
    <div class="min-h-screen flex items-center justify-center mt-12 hidden" id="data-container">
        <div class="bg-white p-8 rounded-lg shadow-lg w-96">
            <h2 class="text-2xl font-semibold text-center mb-4">Dados do Aluno</h2>
            <div id="student-info">
                <!-- Informações do aluno serão carregadas aqui -->
                <p><strong>Plano Ativo:</strong> <span id="active-plan">Plano Mensal</span></p>
                <p><strong>Agendamentos:</strong></p>
                <ul id="appointments">
                    <!-- Lista de agendamentos simulados -->
                    <li>22/04/2025 - Treino de Musculação</li>
                    <li>24/04/2025 - Aula de Yoga</li>
                    <li>26/04/2025 - Consulta com Nutricionista</li>
                </ul>
            </div>
            <button onclick="logout()" class="w-full bg-red-600 text-white py-3 rounded-md hover:bg-red-700 mt-4">Sair</button>
        </div>
    </div>

    <script>
        // Função que simula o login
        function handleLogin(event) {
            event.preventDefault(); // Impede o envio real do formulário
            // Aqui você pode adicionar validações ou animações se necessário

            // Simulando sucesso no login
            showData();
        }

        // Exibe os dados do aluno (tela de dados)
        function showData() {
            // Mostra a tela de dados e oculta a tela de login
            document.getElementById('data-container').classList.remove('hidden');
            document.querySelector('form').classList.add('hidden');
        }

        // Função para simular o logout
        function logout() {
            // Volta para a tela de login
            document.getElementById('data-container').classList.add('hidden');
            document.querySelector('form').classList.remove('hidden');
        }
    </script>
</body>
</html>
