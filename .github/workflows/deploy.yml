name: Deploy

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v1

    - name: Log in to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.elias969 }} # Seu nome de usuário Docker Hub
        password: ${{ secrets.sdHDUEFRCWmWxqbDsQueyL8e538 }} # O token de acesso gerado

    - name: Build and Push Docker Image
      run: |
        # Convert github.repository to lowercase and replace / with -
        REPO_NAME=$(echo $GITHUB_REPOSITORY | tr '[:upper:]' '[:lower:]' | tr '/' '-')
        docker build -t myimage:$REPO_NAME .
        docker push myimage:$REPO_NAME
